<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Quản trị nội dung · Hiền Nương Farm</title>
    <link rel="icon" href="/favicon.svg" />
  </head>
  <body>
    <!-- Sveltia CMS reads ./config.yml (the copy files in src/content/). Pinned version. -->
    <script src="https://unpkg.com/@sveltia/cms@0.221.1/dist/sveltia-cms.js"></script>
    <!-- Annotated screenshots in the preview pane (scripts/admin-guide.mjs). -->
    <script src="./huong-dan/guide.js"></script>
    <script src="./preview.js"></script>
    <!-- After a fresh sign-in, open the homepage in edit mode (src/scripts/edit-mode/).
         Coming here already signed in (“Quản trị đầy đủ”) stays here. -->
    <script>
      (() => {
        const signedIn = () => {
          try { return !!JSON.parse(localStorage.getItem('sveltia-cms.user') || 'null')?.token; } catch { return false; }
        };
        if (signedIn()) return;
        const timer = setInterval(() => {
          if (!signedIn()) return;
          clearInterval(timer);
          location.href = '/?sua=1';
        }, 500);
      })();
    </script>
  </body>
</html>

# Admin (Sveltia CMS) for the page copy in src/content/, labelled in Vietnamese for
# the owner (docs/HUONG_DAN_SUA_NOI_DUNG.md). A field added to a copy file needs an entry here too.
backend:
  name: github
  repo: nhminh55/hiennuongfarm
  branch: main
  base_url: https://hiennuongfarm.pages.dev
  auth_endpoint: api/auth
  commit_messages:
    update: 'Nội dung: sửa {{collection}} · {{slug}}'
media_folder: public/images/uploads
output:
  omit_empty_optional_fields: true
i18n:
  structure: single_file
  locales:
    - vi
    - en
    - zh
  default_locale: vi
collections:
  - name: trang_chu
    label: Trang chủ
    i18n: true
    files:
      - name: 01-mo-dau
        label: Phần mở đầu (ảnh lớn đầu trang)
        file: src/content/trang-chu/01-mo-dau.md
        format: frontmatter
        i18n: true
        fields:
          - label: Tên các phần (thanh bên phải)
            name: sections
            i18n: true
            hint: Theo thứ tự các mục trên trang chủ
            widget: list
            min: 5
            max: 5
            field:
              label: Nội dung
              name: item
              widget: string
          - label: Tiêu đề lớn
            name: title
            i18n: true
            hint: Mỗi ô là một dòng
            widget: list
            min: 2
            max: 2
            field:
              label: Nội dung
              name: item
              widget: string
          - label: Dòng giới thiệu dưới tiêu đề
            name: sub
            i18n: true
            widget: string
          - label: Nút chính
            name: cta
            i18n: true
            widget: string
          - label: Chữ “Kéo xuống”
